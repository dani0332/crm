name: Run Tests

on:
  pull_request:
    branches:
      - develop
      - main
    types: [opened, reopened, edited, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        php: [8.2]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: json, dom, curl, libxml, mbstring, pdo, pdo_sqlite
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Copy environment file
        run: cp .env.example .env || true

      - name: Generate application key
        run: php artisan key:generate || true

      - name: Run Tests
        id: tests
        continue-on-error: true
        run: |
          set +e
          vendor/bin/pest --log-junit test-results.xml > test-output.txt 2>&1
          TEST_EXIT_CODE=$?
          echo "exit_code=$TEST_EXIT_CODE" >> $GITHUB_OUTPUT

          # Extract test summary from Pest output
          # Pest typically shows: "Tests:    123 passed"
          PASSED=$(grep -oE '[0-9]+\s+passed' test-output.txt | grep -oE '[0-9]+' | head -1 || echo "0")
          FAILED=$(grep -oE '[0-9]+\s+failed' test-output.txt | grep -oE '[0-9]+' | head -1 || echo "0")
          WARNINGS=$(grep -oE '[0-9]+\s+warnings?' test-output.txt | grep -oE '[0-9]+' | head -1 || echo "0")
          RISKY=$(grep -oE '[0-9]+\s+risky' test-output.txt | grep -oE '[0-9]+' | head -1 || echo "0")
          SKIPPED=$(grep -oE '[0-9]+\s+skipped' test-output.txt | grep -oE '[0-9]+' | head -1 || echo "0")
          INCOMPLETE=$(grep -oE '[0-9]+\s+incomplete' test-output.txt | grep -oE '[0-9]+' | head -1 || echo "0")

          echo "passed=$PASSED" >> $GITHUB_OUTPUT
          echo "failed=$FAILED" >> $GITHUB_OUTPUT
          echo "warnings=$WARNINGS" >> $GITHUB_OUTPUT
          echo "risky=$RISKY" >> $GITHUB_OUTPUT
          echo "skipped=$SKIPPED" >> $GITHUB_OUTPUT
          echo "incomplete=$INCOMPLETE" >> $GITHUB_OUTPUT

          # Store last 50 lines of output for summary
          tail -50 test-output.txt > test-output-summary.txt

          exit $TEST_EXIT_CODE

      - name: Read Test Output
        id: test-output
        if: always()
        run: |
          if [ -f test-output-summary.txt ]; then
            {
              echo 'output<<EOF'
              cat test-output-summary.txt
              echo EOF
            } >> $GITHUB_OUTPUT
          fi

      - name: Post Test Summary to PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          TEST_OUTCOME: ${{ steps.tests.outcome }}
          TEST_PASSED: ${{ steps.tests.outputs.passed || '0' }}
          TEST_FAILED: ${{ steps.tests.outputs.failed || '0' }}
          TEST_WARNINGS: ${{ steps.tests.outputs.warnings || '0' }}
          TEST_RISKY: ${{ steps.tests.outputs.risky || '0' }}
          TEST_SKIPPED: ${{ steps.tests.outputs.skipped || '0' }}
          TEST_INCOMPLETE: ${{ steps.tests.outputs.incomplete || '0' }}
          TEST_EXIT_CODE: ${{ steps.tests.outputs.exit_code || 'N/A' }}
          TEST_OUTPUT: ${{ steps.test-output.outputs.output }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const prNumber = context.payload.pull_request.number;
            const marker = '<!-- test-summary-comment -->';

            // Build the comment body
            const statusEmoji = process.env.TEST_OUTCOME === 'success' ? '✅' : '❌';
            const statusText = process.env.TEST_OUTCOME === 'success' ? '**All tests passed!**' : '**Tests failed!**';
            const statusBadge = process.env.TEST_OUTCOME === 'success' ? '✅ Success' : '❌ Failed';

            const testOutput = process.env.TEST_OUTPUT || 'No output captured';

            const commentBody = `${marker}
            ## 🧪 Test Results Summary

            ${statusEmoji} ${statusText}

            | Metric | Count |
            |--------|-------|
            | ✅ Passed | ${process.env.TEST_PASSED} |
            | ❌ Failed | ${process.env.TEST_FAILED} |
            | ⚠️ Warnings | ${process.env.TEST_WARNINGS} |
            | ⚡ Risky | ${process.env.TEST_RISKY} |
            | ⏭️ Skipped | ${process.env.TEST_SKIPPED} |
            | ⚠️ Incomplete | ${process.env.TEST_INCOMPLETE} |

            **Status:** ${statusBadge} | **Exit Code:** \`${process.env.TEST_EXIT_CODE}\`

            <details>
            <summary>📋 View Test Output (Last 50 lines)</summary>

            \`\`\`text
            ${testOutput}
            \`\`\`

            </details>

            ---
            *This comment is automatically updated on each test run*`;

            // Get all comments on the PR
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });

            // Find existing test summary comments (by marker and bot user)
            const existingComments = comments.filter(comment => 
              comment.body.includes(marker) && comment.user.type === 'Bot'
            );

            // Delete all existing test summary comments to prevent duplicates
            for (const comment of existingComments) {
              await github.rest.issues.deleteComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: comment.id,
              });
            }

            // Create new comment
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: commentBody,
            });

      - name: Run Tests with Coverage (optional)
        if: false
        run: vendor/bin/pest --coverage
