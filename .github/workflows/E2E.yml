name: Test and Build

on:
  pull_request:
    branches:
      - main
    types: [opened, reopened]

jobs:
  cypress-run:
    # if: github.event.deployment_status.state == 'success'
    runs-on: ubuntu-latest
    env:
      BASE_URL: ${{secrets.BASE_URL}}
      API_TOKEN: ${{secrets.API_TOKEN}}
      IM_ASSETS_DOMAIN: ${{secrets.IM_ASSETS_DOMAIN}}
      RECAPTCHA_ENTERPRISE_PROJECT_ID: ${{secrets.RECAPTCHA_ENTERPRISE_PROJECT_ID}}
      RECAPTCHA_ENTERPRISE_SITE_KEY: ${{secrets.RECAPTCHA_ENTERPRISE_SITE_KEY}}
      RECAPTCHA_ENTERPRISE_API_KEY: ${{secrets.RECAPTCHA_ENTERPRISE_API_KEY}}
      SENDGRID_USERNAME: ${{secrets.SENDGRID_USERNAME}}
      SENDGRID_PASSWORD: ${{secrets.SENDGRID_PASSWORD}}
      SMTP_ENDPOINT: ${{secrets.SMTP_ENDPOINT}}
      SMTP_PORT: ${{secrets.SMTP_PORT}}
      SMTP_USERNAME: ${{secrets.SMTP_USERNAME}}
      SMTP_PASSWORD: ${{secrets.SMTP_PASSWORD}}
      VERCEL_ENV: ${{secrets.VERCEL_ENV}}
      ECOM_URL: ${{secrets.ECOM_URL}}
      GTM_ID: ${{secrets.GTM_ID}}

    steps:
      - name: Checkout
        uses: actions/checkout@v2

      - name: Change String Case
        id: string
        uses: ASzc/change-string-case-action@v2
        with:
          # string: production
          string: ${{ github.event.deployment_status.environment }}

      - name: Cypress run
        uses: cypress-io/github-action@v4.2.1
        env:
          CYPRESS_VERCEL_ENV: ${{ steps.string.outputs.lowercase }}
          CYPRESS_PROJECT_ID: ${{ secrets.CYPRESS_PROJECT_ID }}
          CYPRESS_RECORD_KEY: ${{ secrets.CYPRESS_RECORD_KEY }}
          # CYPRESS_BASE_URL: http://localhost:3000/
          CYPRESS_BASE_URL: ${{ github.event.deployment_status.target_url }}
          CYPRESS_IM_EMAIL_DOMAIN_STAGING: ${{ secrets.IM_EMAIL_DOMAIN_STAGING }}
          CYPRESS_IM_EMAIL_DOMAIN_PROD: ${{ secrets.IM_EMAIL_DOMAIN_PROD }}
        with:
          # build: yarn build
          # start: yarn start
          browser: chrome
          record: true

      - name: Assign PR when failed
        if: failure() && github.event_name == 'pull_request'
        uses: actions-ecosystem/action-add-assignees@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # E2E_TESTER_USERNAMES can be separated by "\n" e.g. "manalliaquat\nabdullahinsurance"
          assignees: ${{ secrets.E2E_TESTER_USERNAMES }}
          number: ${{ github.event.number }}
