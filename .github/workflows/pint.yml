name: Run Pint Fix

on:
  pull_request:
    branches:
      - develop
      - main
    types: [opened, reopened, edited, synchronize]

jobs:
  check-vue-files:
    runs-on: ubuntu-latest
    outputs:
      has-vue-files: ${{ steps.check.outputs.has-vue-files }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for Vue files
        id: check
        run: |
          # Get changed files in the PR
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            # Get the base and head refs
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
            
            # Get list of changed files
            CHANGED_FILES=$(git diff --name-only --diff-filter=ACMR ${BASE_SHA}..${HEAD_SHA} || echo "")
            
            # Check if any Vue files are in the changed files
            VUE_FILES=$(echo "$CHANGED_FILES" | grep -E '\.vue$' || echo "")
            
            if [ -n "$VUE_FILES" ]; then
              echo "has-vue-files=true" >> $GITHUB_OUTPUT
              echo "Found Vue files in PR:"
              echo "$VUE_FILES"
            else
              echo "has-vue-files=false" >> $GITHUB_OUTPUT
              echo "No Vue files found in PR changes"
            fi
          else
            # For non-PR events, default to false
            echo "has-vue-files=false" >> $GITHUB_OUTPUT
          fi

  build:
    needs: check-vue-files
    if: needs.check-vue-files.outputs.has-vue-files == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        php: [8.2]

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0 # Required to push back to the PR branch

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: json, dom, curl, libxml, mbstring, pdo, pdo_sqlite
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Copy environment file
        run: cp .env.example .env || true

      - name: Generate application key
        run: php artisan key:generate || true

      - name: Run Tests
        run: vendor/bin/pest

      - name: Run Pint Fix
        run: composer pint:fix

      - name: Commit and Push Pint Fix
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore: apply pint fix'
          branch: ${{ github.head_ref }} # Push only to the PR branch
          push_options: '--force-with-lease'
          skip_fetch: true # Don't fetch all branches

