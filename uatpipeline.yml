trigger:
- none

pool:
  vmImage: 'Ubuntu 20.04'

  
steps:
- task: DownloadSecureFile@1
  name: fullchain
  displayName: 'Download cert file'
  inputs:
    secureFile: 'uatcrm_fullchain.pem'
- task: DownloadSecureFile@1
  name: privkey
  displayName: 'Download cert file'
  inputs:
    secureFile: 'uatcrm_privkey.pem'    
- script: |
    cp $(fullchain.secureFilePath) $(System.DefaultWorkingDirectory)/docker/
    cp $(privkey.secureFilePath) $(System.DefaultWorkingDirectory)/docker/

- publish: '$(System.DefaultWorkingDirectory)'
  artifact: imcrmuat
