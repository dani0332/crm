[program:fix_permissions]
command=sh -c "mkdir -p /var/www/storage/logs && touch /var/www/storage/logs/laravel-$(date +%%Y-%%m-%%d).log && touch /var/www/storage/logs/laravel-$(date -d 'tomorrow' +%%Y-%%m-%%d).log && chown -R www-data:www-data /var/www/storage && chmod -R 775 /var/www/storage && chmod -R g+s /var/www/storage && sleep 86400"
autostart=true
autorestart=true
startsecs=0
priority=10
startretries=3
user=root
