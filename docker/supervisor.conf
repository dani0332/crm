[supervisord]
nodaemon=true
loglevel = info
logfile=/var/log/php/supervisord.log
pidfile=/tmp/supervisord.pid

[unix_http_server]
file=/tmp/supervisor.sock
chmod=0700
chown=www:www

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[group:laravel-worker]
priority=999
programs=nginx,php-fpm,horizon,laravel-queue-sqs

[program:nginx]
priority=10
autostart=true
autorestart=true
stderr_logfile_maxbytes=0
stdout_logfile_maxbytes=0
stdout_events_enabled=true
stderr_events_enabled=true
command=/usr/sbin/nginx -g 'daemon off;'
stderr_logfile=/var/log/nginx/error.log
stdout_logfile=/var/log/nginx/access.log

[program:php-fpm]
priority=5
autostart=true
autorestart=true
stderr_logfile_maxbytes=0
stdout_logfile_maxbytes=0
command=/usr/local/sbin/php-fpm -R
stderr_logfile=/var/log/nginx/php-error.log
stdout_logfile=/var/log/nginx/php-access.log

[program:laravel-schedule]
numprocs=1
autostart=true
autorestart=true
redirect_stderr=true
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/artisan schedule:work
stdout_logfile=/var/log/nginx/schedule.log

# [program:laravel-queue]
# numprocs=2
# autostart=true
# autorestart=true
# redirect_stderr=true
# process_name=%(program_name)s_%(process_num)02d
# stdout_logfile=/var/log/nginx/worker.log
# command=php /var/www/artisan queue:work redis --tries=3 --backoff=3 --queue=default,renewals


[program:horizon]
process_name=%(program_name)s
command=php /var/www/artisan horizon
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/var/log/nginx/horizon.log
stopwaitsecs=3600

# SQS worker for ProcessMyAlfredWelcomeEmailSqsJob (connection sqs_myalfred is forced on the job).
# Match job defaults: tries=3, timeout=120 (see app/Jobs/ProcessMyAlfredWelcomeEmailSqsJob.php).
[program:laravel-queue-sqs]
process_name=%(program_name)s
command=php /var/www/artisan queue:work sqs_myalfred --sleep=3 --tries=3 --timeout=120
directory=/var/www
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/var/log/nginx/laravel-queue-sqs.log
stopwaitsecs=3600
startretries=10

