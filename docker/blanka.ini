[PHP]

; Maximum allowed size for uploaded files.
; http://php.net/upload-max-filesize
upload_max_filesize = 100M

; Maximum size of POST data that PHP will accept.
; Its value may be 0 to disable the limit. It is ignored if POST data reading
; is disabled through enable_post_data_reading.
; http://php.net/post-max-size
post_max_size = 100M

; Memory limit
memory_limit = 512M

; Execution time limits - Critical for SSE connections
max_execution_time = 1200
max_input_time = 900

; Output buffering settings - Critical for SSE real-time streaming
output_buffering = Off
implicit_flush = On
zlib.output_compression = Off

; Connection handling for long-lived requests
default_socket_timeout = 1200
auto_detect_line_endings = On

; Error handling for SSE debugging
log_errors = On
error_log = /var/log/php/errors.log

; Session settings for SSE connections
session.gc_maxlifetime = 1440
session.cookie_lifetime = 0

; Disable user abort for SSE streams
ignore_user_abort = On


; Process manager settings optimized for concurrent connections
pm = dynamic
pm.max_children = 100       ; Significantly increased for load testing
pm.start_servers = 20       ; More starting servers for immediate availability
pm.min_spare_servers = 10   ; Minimum spare servers
pm.max_spare_servers = 30   ; Maximum spare servers
pm.process_idle_timeout = 60s
pm.max_requests = 1000      ; Requests per child process before respawn

; Status monitoring
pm.status_path = /fpm-status
ping.path = /fpm-ping
ping.response = pong

; Logging
php_admin_flag[log_errors] = on

; Additional PHP settings for long-running connections
php_value[max_execution_time] = 900
php_value[max_input_time] = 900
php_value[memory_limit] = 256M

; Environment variables
env[HOSTNAME] = $HOSTNAME
env[PATH] = /usr/local/bin:/usr/bin:/bin
env[TMP] = /tmp
env[TMPDIR] = /tmp
env[TEMP] = /tmp

; Additional security and performance settings
security.limit_extensions = .php .php3 .php4 .php5 .php7 .php8
catch_workers_output = yes
decorate_workers_output = no
