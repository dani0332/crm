server {
    listen 443 ssl;
    server_name imcrmdev.alfred.ae;
    root /var/www/public;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    index index.php index.html;
    charset utf-8;

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;
    client_max_body_size 300M;

    proxy_send_timeout 600s;
    proxy_read_timeout 600s;
    fastcgi_send_timeout 600s;
    fastcgi_read_timeout 600s;
    client_body_timeout 300s;
    client_header_timeout 300s;
    keepalive_timeout 180;
    large_client_header_buffers 4 32k;

    # events {
    #     worker_connections 4096;  # Increased from default 1024 for SSE load testing
    # }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        #fastcgi_pass unix:/var/run/php/php8.0-fpm.sock;
        #fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        #include fastcgi_params;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_buffering off;
    }

    # SSE endpoints - Both test and production
    location ~ ^/api/v1/bor/(details/sse/|test-sse) {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        
        # SSE-specific optimizations - Disable ALL buffering
        fastcgi_buffering off;
        fastcgi_request_buffering off;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        gzip off;
        
        # Extended timeouts for long-lived SSE connections
        fastcgi_read_timeout 1200s;     # 20 minutes
        fastcgi_send_timeout 1200s;
        fastcgi_connect_timeout 60s;
        proxy_read_timeout 1200s;
        proxy_send_timeout 1200s;
        proxy_connect_timeout 60s;
        
        # Keep connection alive settings
        keepalive_timeout 1200s;
        keepalive_requests 1000;
        
        # Additional settings to handle client disconnections
        reset_timedout_connection on;
        client_body_timeout 60s;
        client_header_timeout 60s;
        send_timeout 1200s;
        
        # Headers for SSE
        add_header Content-Type "text/event-stream" always;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        add_header X-Accel-Buffering "no" always;
        
        # CORS headers
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, Cache-Control" always;
        
        # Handle preflight requests
        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin "*";
            add_header Access-Control-Allow-Methods "GET, OPTIONS";
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, Cache-Control";
            add_header Content-Length 0;
            add_header Content-Type "text/plain";
            return 204;
        }
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
        gzip_static on;
	}

    location /ws {
        if ($http_origin != 'wss://ws-ap1.pusher.com')
        { return 403; }
        add_header 'Access-Control-Allow-Origin' 'wss://ws-ap1.pusher.com' always;
        add_header 'Access-Control-Allow-Methods' 'POST' always;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    #ssl off;
    ssl_certificate /etc/nginx/conf.d/fullchain.pem;
    ssl_certificate_key /etc/nginx/conf.d/privkey.pem;
}
