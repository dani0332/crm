receivers:
  filelog:
    include: [ "/var/www/storage/logs/laravel-*.log" ]
    start_at: beginning
    include_file_name: true
    include_file_path: true
    operators:
      - type: regex_parser
        regex: '^\[(?P<time>\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2})\] (?P<env>[^\.]+)\.(?P<level>[^:]+): (?P<message>.*?)(?:\s*\{[^}]+\})?\s*$'
        timestamp:
          parse_from: attributes.time
          layout: '%Y-%m-%d %H:%M:%S'
        severity:
          parse_from: attributes.level
          mapping:
            debug: DEBUG
            info: INFO
            notice: INFO
            warning: WARN
            error: ERROR
            critical: FATAL
            alert: FATAL
            emergency: FATAL
      - type: json_parser
        parse_from: attributes.message
        if: 'attributes.message matches ".*\\{.*\\}.*"'
        on_error: send

processors:
  batch:
    timeout: 1s
    send_batch_size: 1024

exporters:
  otlphttp:
    endpoint: https://api.axiom.co
    headers:
      authorization: Bearer ${AXIOM_API_TOKEN}
      x-axiom-dataset: ${AXIOM_DATASET}
    compression: gzip
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      max_elapsed_time: 300s

service:
  telemetry:
    logs:
      level: debug
  pipelines:
    logs:
      receivers: [filelog]
      processors: [batch]
      exporters: [otlphttp]