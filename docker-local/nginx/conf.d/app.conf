server {
    listen 80;
    index index.php index.html;
    error_log  /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;
    root /var/www/public;
    client_max_body_size 2048M;
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass appblanka:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;

        location ~ ^/api/v1/bor/details/sse {
            # SSE specific FastCGI settings
            fastcgi_read_timeout 1800s;      # 30 minutes for SSE
            fastcgi_send_timeout 1800s;      # 30 minutes for SSE
            fastcgi_connect_timeout 60s;
            
            # Nginx timeout settings for SSE
            send_timeout 1800s;
            keepalive_timeout 1800s;
            keepalive_requests 1000;
        }

    }
    location / {
        try_files $uri $uri/ /index.php?$query_string;
        gzip_static on;
    }
}