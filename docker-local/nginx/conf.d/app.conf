server {
    listen 80;
    index index.php index.html;
    error_log  /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;
    root /var/www/public;

    # Timeout configurations (increased for heavy queue jobs)
    fastcgi_connect_timeout 600;
    fastcgi_send_timeout 5000;
    fastcgi_read_timeout 5000;
    proxy_connect_timeout 600;
    proxy_send_timeout 5000;
    proxy_read_timeout 5000;
    send_timeout 5000;
    
    # Buffer settings
    fastcgi_buffer_size 16k;
    fastcgi_buffers 16 16k;
    
    # Request body settings
    client_max_body_size 20M;
    client_body_timeout 600;

    keepalive_timeout 650;

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_read_timeout 900;  # Match with PHP max_execution_time
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass appblanka:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;

        location ~ ^/api/v1/bor/details/sse {
            # SSE specific FastCGI settings
            fastcgi_buffering off;
            fastcgi_read_timeout 5000s;       # 30 minutes for SSE
            fastcgi_send_timeout 5000s;       # 30 minutes for SSE
            fastcgi_connect_timeout 60s;
            
            # Nginx timeout settings for SSE
            send_timeout 1800s;
            keepalive_timeout 1800s;
            keepalive_requests 1000;
        }
    }
    location / {
        try_files $uri $uri/ /index.php?$query_string;
        gzip_static on;
    }
}