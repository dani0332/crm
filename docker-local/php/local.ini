# xdebug extension config below
zend_extension=xdebug.so
xdebug.mode=debug
allow_url_fopen=1
xdebug.start_with_request=yes
xdebug.client_host=host.docker.internal
xdebug.client_port=9003
xdebug.log=/var/log/xdebug.log
xdebug.discover_client_host=0
xdebug.max_nesting_level=-1

expose_php=0
log_errors=1
memory_limit=4096M            ; Increased from 2048M to 4096M for queue jobs
post_max_size=2048M
upload_max_filesize=2048M
max_execution_time=5000       ; Increased to 1800 seconds (30 minutes) for heavy jobs
max_input_time=5000           ; Match with max_execution_time
max_file_uploads=5000

; Additional timeout-related settings
request_terminate_timeout=5000  ; Match with max_execution_time
default_socket_timeout=5000    ; Socket timeout
max_input_vars=5000            ; If handling large forms

; Memory management
realpath_cache_size=4096K      ; Increase realpath cache
realpath_cache_ttl=600         ; Cache paths for 10 minutes