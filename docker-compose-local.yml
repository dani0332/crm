version: '3'
services:
  #PHP Service
  appblanka:
    build:
      context: .
      dockerfile: Dockerfile_Local
      args:
        - DOPPLER_TOKEN_IMCRM=$DOPPLER_TOKEN_IMCRM
    container_name: appblanka
    restart: unless-stopped
    tty: false
    environment:
      DOPPLER_TOKEN_IMCRM: ${DOPPLER_TOKEN_IMCRM}
      SERVICE_NAME: appblanka
      SERVICE_TAGS: dev
      PHP_IDE_CONFIG: 'serverName=Docker'
      XDEBUG_CONFIG: 'client_host=host.docker.internal client_port=9003'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    working_dir: /var/www
    volumes:
      - ./:/var/www
      - ../dhalsim:/var/www/dhalsim
      - ./.env:/var/www/dhalsim/.env
      - ./docker-local/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    networks:
      - blanka-app-network

  #Nginx Service
  blankawebserver:
    image: nginx:alpine
    container_name: blanka
    restart: unless-stopped
    tty: true
    ports:
      - '$WEB_PORT:80'
      - '$SSL_PORT:443'
    volumes:
      - ./:/var/www
      - ./docker-local/nginx/conf.d/:/etc/nginx/conf.d/
    networks:
      - blanka-app-network

  #MySQL Service
  dbblanka:
    image: mysql:8.0.40
    container_name: dbblanka
    restart: unless-stopped
    tty: false
    ports:
      - '$DB_MIRROR_PORT:3306'
    environment:
      MYSQL_DATABASE: blanka_db
      MYSQL_ROOT_PASSWORD: root
      SERVICE_TAGS: dev
      SERVICE_NAME: mysql
    volumes:
      - dbdata:/var/lib/mysql/
      - ./docker-local/mysql/my.cnf:/etc/mysql/my.cnf
    networks:
      - blanka-app-network

  redisblanka:
    image: 'redis:latest'
    ports:
      - '6379:6379'
    networks:
      - blanka-app-network

  redis-commander-blanka:
    image: rediscommander/redis-commander:latest
    environment:
      - REDIS_HOSTS=local:redisblanka:6379
    ports:
      - '8081:8081'
    networks:
      - blanka-app-network
#Docker Networks
networks:
  blanka-app-network:
    driver: bridge
#Volumes
volumes:
  dbdata:
    driver: local
  sailmeilisearch:
    driver: local
