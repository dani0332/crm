version: '3'
services:
  #PHP Service
  appblanka:
    build:
      context: .
      dockerfile: Dockerfile_Local
      args:
        - DOPPLER_TOKEN_IMCRM=$DOPPLER_TOKEN_IMCRM
    container_name: appblanka
    restart: unless-stopped
    tty: false
    environment:
      DOPPLER_TOKEN_IMCRM: ${DOPPLER_TOKEN_IMCRM}
      SERVICE_NAME: appblanka
      SERVICE_TAGS: dev
    working_dir: /var/www
    volumes:
      - ./:/var/www
      - ../dhalsim:/var/www/dhalsim
      - ./.env:/var/www/dhalsim/.env
      - ./docker-local/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    networks:
      - blanka-app-network

  #Nginx Service
  blankawebserver:
    image: nginx:alpine
    container_name: blanka
    restart: unless-stopped
    tty: true
    ports:
      - '$WEB_PORT:80'
      - '$SSL_PORT:443'
    volumes:
      - ./:/var/www
      - ./docker-local/nginx/conf.d/:/etc/nginx/conf.d/
    networks:
      - blanka-app-network

  #MySQL Service
  dbblanka:
    image: mariadb:10.3.23
    container_name: dbblanka
    restart: unless-stopped
    tty: false
    ports:
      - '$DB_MIRROR_PORT:3306'
    environment:
      MYSQL_DATABASE: blanka_db
      MYSQL_ROOT_PASSWORD: root
      SERVICE_TAGS: dev
      SERVICE_NAME: mariadb
    volumes:
      - dbdata:/var/lib/mysql/
      - ./docker-local/mysql/my.cnf:/etc/mysql/my.cnf
    networks:
      - blanka-app-network
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadminblanka
    restart: always
    networks:
      - blanka-app-network
    depends_on:
      - dbblanka
    environment:
      PMA_HOST: dbblanka
      PMA_USER: root
      PMA_PASSWORD: root
      PMA_PORT: 3306
      PMA_ARBITRARY: 1
    ports:
      - '$PHPMYADMIN_PORT:80'
  meilisearch:
    image: 'getmeili/meilisearch:latest'
    ports:
      - '7700:7700'
    volumes:
      - 'sailmeilisearch:/data.ms'
    networks:
      - blanka-app-network
  mailhogblanka:
    networks:
      - blanka-app-network
    image: mailhog/mailhog
    ports:
      - $MAIL_PORT:1025 # smtp server
      - $MAIL_UI_PORT:8025 # web ui
  redisblanka:
    image: 'redis:latest'
    ports:
      - '6379:6379'
    networks:
      - blanka-app-network
  redis-commander-blanka:
    image: rediscommander/redis-commander:latest
    environment:
      - REDIS_HOSTS=local:redisblanka:6379
    ports:
      - '8081:8081'
    networks:
      - blanka-app-network
#Docker Networks
networks:
  blanka-app-network:
    driver: bridge
#Volumes
volumes:
  dbdata:
    driver: local
  sailmeilisearch:
    driver: local
