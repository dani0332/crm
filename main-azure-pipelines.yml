trigger:
- main

pool:
  vmImage: ubuntu-latest
name: 1.0$(Rev:.r)

variables:
  phpVersion: 7.2

steps:
- checkout: self
  persistCredentials: true
- script: |
    git tag main-$(Build.BuildId)
    git tag
    git push --tag

- task: DownloadSecureFile@1
  name: fullchain
  displayName: 'Download cert file'
  inputs:
    secureFile: 'imcrm_fullchain.pem'
- task: DownloadSecureFile@1
  name: privkey
  displayName: 'Download cert file'
  inputs:
    secureFile: 'imcrm_privkey.pem'    
- script: |
    cp $(fullchain.secureFilePath) $(System.DefaultWorkingDirectory)/docker/
    cp $(privkey.secureFilePath) $(System.DefaultWorkingDirectory)/docker/
#- task: DownloadSecureFile@1
#  name: env
#  displayName: 'Download env file'
#  inputs:
#    secureFile: '.env.crmprod'
#- script: cp $(env.secureFilePath) $(System.DefaultWorkingDirectory)/

- publish: '$(System.DefaultWorkingDirectory)'
  artifact: myalfredcrm
