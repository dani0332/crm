sonar.projectKey=InsuranceMarket-ae_blanka
sonar.organization=myalfred
sonar.exclusions=\
  database/**,\
  resources/views/**,\
  resources/docs/**,\
  resources/css/**,\
  vendor/**,\
  node_modules/**,\
  storage/**,\
  bootstrap/**,\
  public/storage/**,\
  public/css/**,\
  public/js/**,\
  public/build/**,\
  public/old/**,\
  public/dist/**,\
  public/vendor/**,\
  public/vendors/**,\
  tests/**,\
  cypress/**,\
  docs/**,\
  docker/**,\
  docker-local/**,\
  stubs/**,\
  resources/lang/**,\
  resources/markdown/**,\
  documentation/**,\
  data/**,\
  **/*.json,\
  **/*.xml,\
  **/*.lock,\
  .env*,\
  artisan,\
  server.php

# This is the name and version displayed in the SonarCloud UI.
#sonar.projectName=blanka
#sonar.projectVersion=1.0


# Path is relative to the sonar-project.properties file. Replace "\" by "/" on Windows.
#sonar.sources=.

# Encoding of the source code. Default is default system encoding
#sonar.sourceEncoding=UTF-8


# Performance optimizations - Focus on new code only
# SonarCloud automatically analyzes only changed files in PRs (new code focus)
# For main/develop branches, you can define new code period to focus analysis:
sonar.leak.period=previous_version  # Compare against previous version
# sonar.leak.period=30  # Last 30 days
# sonar.leak.period=2024-01-01  # Since specific date

# Enable incremental analysis to skip unchanged files
sonar.incremental=true
# Cache analysis results for faster subsequent runs
sonar.cache.enabled=true
# Reduce verbosity for faster execution
sonar.verbose=false
# Skip test files from analysis (tests are already excluded in exclusions, but this ensures it)
sonar.test.exclusions=**/*