version: "3"

services:
  laravel:
    #build: 
    # context: .
    # dockerfile: Dockerfile
    image: ${ACRNAME}.azurecr.io/imcrm${DOCKERENV}:Build.BuildId 
    
    environment:
     - DOPPLER_TOKEN 
