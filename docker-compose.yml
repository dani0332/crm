version: '3'

services:
  laravel:
    #container_name: imcrm${DOCKERENV}
    #image: imcrm${DOCKERENV}:latest
    image: ${ACRNAME}.azurecr.io/imcrm${DOCKERENV}:latest
    container_name: imcrm${DOCKERENV}
    environment:
      - DOPPLER_TOKEN
    ports:
      - '${WEB_PORT}:443'
    volumes:
      - /home/azureuser/imcrm/${LOGS}:/var/www/storage/logs
      - .:/var/www/html
    restart: unless-stopped

volumes:
  logs:
  stglogs:
  devlogs:
  dev01logs:
  dev02logs:
  uatlogs:
  uat2logs:
  testlogs:
  
# Set BuildKit globally for the build
x-docker-args:
  build:
    environment:
      DOCKER_BUILDKIT: 1
